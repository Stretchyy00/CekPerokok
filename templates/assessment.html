<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assessment - Smoking Checker</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Smoking Assessment</h2>
            <p>Isi data di bawah dengan jujur</p>
        </header>

        <form id="assessmentForm" method="post" action="result.html">
            <h3>Data Utama</h3>
            <div class="form-group">
                <label for="age">Umur Sekarang</label>
                <input type="number" id="age" name="age" required min="1">
            </div>

            <div class="form-group">
                <label for="start_age">Mulai Merokok Umur</label>
                <input type="number" id="start_age" name="start_age" required min="1">
            </div>

            <div class="form-group">
                <label for="cigarettes_per_day">Rokok per Hari (batang)</label>
                <input type="number" id="cigarettes_per_day" name="cigarettes_per_day" required min="0">
            </div>

            <div class="form-group">
                <label for="cigarette_type">Jenis Rokok</label>
                <select id="cigarette_type" name="cigarette_type" required>
                    <option value="Rokok Konvensional">Rokok Konvensional</option>
                    <option value="Rokok Elektrik / Vape">Rokok Elektrik / Vape</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tried_to_quit">Pernah Mencoba Berhenti?</label>
                <select id="tried_to_quit" name="tried_to_quit" required>
                    <option value="Ya">Ya</option>
                    <option value="Belum">Belum</option>
                </select>
            </div>

            <div class="form-group">
                <label for="exercise_frequency">Frekuensi Olahraga</label>
                <select id="exercise_frequency" name="exercise_frequency" required>
                    <option value="jarang">Jarang</option>
                    <option value="cukup">Cukup</option>
                    <option value="rutin">Rutin</option>
                    <option value="tidak_pernah">Tidak Pernah</option>
                </select>
            </div>

            <div class="form-group">
                <label for="secondhand_exposure">Paparan Asap Rokok</label>
                <select id="secondhand_exposure" name="secondhand_exposure" required>
                    <option value="sering">Sering</option>
                    <option value="kadang">Kadang</option>
                    <option value="jarang">Jarang</option>
                    <option value="tidak_pernah">Tidak Pernah</option>
                </select>
            </div>

            <div class="form-group">
                <label for="smoke_time">Waktu Merokok</label>
                <select id="smoke_time" name="smoke_time" required>
                    <option value="pagi">Pagi</option>
                    <option value="siang">Siang</option>
                    <option value="sore">Sore</option>
                    <option value="malam">Malam</option>
                    <option value="sepanjang_hari">Sepanjang Hari</option>
                </select>
            </div>

            <div class="form-group">
                <label for="triggers">Pemicu Merokok</label>
                <textarea id="triggers" name="triggers" rows="3" placeholder="Contoh: stres, teman, setelah makan"></textarea>
            </div>

            <button type="submit" class="btn">Lanjutkan</button>
        </form>
    </div>
    <script src="../static/js/script.js"></script>
</body>
</html>
